<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Waste Image Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        form { margin-bottom: 20px; }
        input[type=file] { display: block; margin: 0 auto 20px auto; }
        .result { background: #eafaf1; padding: 15px; border-radius: 6px; margin-top: 20px; }
        .probs { margin-top: 10px; }
        .probs ul { padding-left: 20px; }
        .probs li { font-size: 0.95em; }
        .img-preview { display: block; margin: 0 auto 20px auto; max-width: 100%; max-height: 200px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>E-Waste Image Prediction</h1>
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Predict</button>
        </form>
        {% if filename %}
            <img src="/uploads/{{ filename }}" class="img-preview" alt="Uploaded Image">
        {% endif %}
        {% if prediction %}
        <div class="result">
            <strong>Prediction:</strong> {{ prediction }}<br>
            <strong>Confidence:</strong> {{ confidence }}
            <div class="probs">
                <strong>Class Probabilities:</strong>
                <ul>
                {% for cname, prob in class_probs %}
                    <li>{{ cname }}: {{ prob }}</li>
                {% endfor %}
                </ul>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
